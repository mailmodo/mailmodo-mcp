# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: mm-mcp-prod

on:
  push:
    branches:
      - main

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@master

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 'Docker Login'
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.ACR_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          context: ${{ github.workspace }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: ${{ github.workspace }}/Dockerfile.server
          push: true
          tags: |
            ${{ secrets.ACR_SERVER }}/mm-mcp-prod:${{ github.sha }}
            ${{ secrets.ACR_SERVER }}/mm-mcp-prod:latest
          platforms: linux/amd64

  deploy-docker-image:     
    runs-on: ubuntu-latest
    needs: build-docker-image
    environment: production
    timeout-minutes: 10
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_MCP_PROD }}

      - name: Azure CLI script to update Container App
        uses: azure/CLI@v1
        with:
          inlineScript: |
            set -euo pipefail

            # These must match the live resource. The app is NOT in the
            # consumption environment the rest of the supplementary apps use:
            # it sits in rg-mm-apps-prod / cae-mm-container-apps-prod, where
            # Pulumi declares it (min/max replica 1, ingress port 3000,
            # mcp.app.mailmodo.com custom domain).
            RESOURCE_GROUP="rg-mm-apps-prod"
            az extension add --name containerapp --upgrade

            az containerapp update -n mm-mcp-prod -g $RESOURCE_GROUP \
            --image ${{ secrets.ACR_SERVER }}/mm-mcp-prod:${{ github.sha }}